<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light only" />
    <title>Your eqlShare verification code</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #fff8ee;
      font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;,
        Roboto, Helvetica, Arial, sans-serif;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      bgcolor="#FFF8EE"
      style="background-color: #fff8ee"
    >
      <tr>
        <td align="center" style="padding: 40px 16px">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="max-width: 480px"
          >
            <tr>
              <td align="left" style="padding: 0 0 24px 4px">
                <img
                  src="https://www.eqlshare.com/email/eqlshare-lockup.png"
                  width="167"
                  height="36"
                  alt="eqlShare"
                  style="
                    display: block;
                    border: 0;
                    outline: none;
                    width: 167px;
                    height: 36px;
                  "
                />
              </td>
            </tr>
            <tr>
              <td
                bgcolor="#FFFFFF"
                style="
                  background-color: #ffffff;
                  border: 2px solid #2b2210;
                  border-radius: 20px;
                  padding: 36px 32px;
                  box-shadow: 0 4px 0 #2b2210;
                "
              >
                <h1
                  style="
                    margin: 0 0 12px;
                    font-size: 26px;
                    line-height: 1.2;
                    font-weight: 800;
                    color: #2b2210;
                    letter-spacing: -0.5px;
                  "
                >
                  Confirm it's you
                </h1>
                <p
                  style="
                    margin: 0 0 28px;
                    font-size: 16px;
                    line-height: 1.6;
                    color: #2b2210;
                  "
                >
                  Enter this code in eqlShare to finish what you started.
                </p>
                <p style="margin: 0 0 8px; font-size: 13px; color: #6b6f8a">
                  Your code:
                </p>
                <div
                  style="
                    display: inline-block;
                    padding: 12px 20px;
                    background-color: #fff8ee;
                    border: 2px solid #2b2210;
                    border-radius: 12px;
                    font-family: &quot;SF Mono&quot;, Menlo, Consolas, monospace;
                    font-size: 26px;
                    font-weight: 800;
                    letter-spacing: 6px;
                    color: #2b2210;
                  "
                >
                  {{ .Token }}
                </div>
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 24px 4px 0;
                  font-size: 12px;
                  line-height: 1.6;
                  color: #6b6f8a;
                "
              >
                If you didn't request this code, someone may be trying to change
                your account. You can ignore this email.<br />
                &copy; eqlShare &middot;
                <a href="https://www.eqlshare.com" style="color: #6b6f8a"
                  >eqlshare.com</a
                >
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
